name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pip install "git+https://github.com/achh-914/AEGIS.git@9ac07f1fa342025a8dec22b09ed1844444b4a03c"
      - run: pytest -rs
